name: ECOS Daily Fetch

on:
  schedule:
    # 매일 KST 06:10 (UTC 21:10 전날)
    - cron: '10 21 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '수동 실행 이유 (선택)'
        required: false
        default: 'manual trigger'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 1단계: 원천 데이터 수집 ──────────────────────────────────────────
      - name: Step 1a - Fetch ECOS data (21개 지표)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python ecos_fetch.py

      - name: Step 1b - Fetch KOSIS data (11개 지표)
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python kosis_fetch.py

      - name: Step 1b-check - KOSIS 수집 성공률 검증 (최소 8/11)
        run: |
          python - << 'PYEOF'
          import pandas as pd, sys
          df = pd.read_csv("data/kosis_latest.csv")
          ok = int(df["value"].notna().sum())
          total = len(df)
          print(f"KOSIS 수집: {ok}/{total} 지표 성공")
          if ok < 8:
              print(f"[FAIL] KOSIS 수집 {ok}/{total} — 최소 8개 미달. 파이프라인 중단.")
              sys.exit(1)
          print("[OK] KOSIS 수집 기준 통과")
          PYEOF

      - name: Step 1c - Merge ECOS + KOSIS → macro_latest.csv
        run: python scripts/merge_macro.py

      - name: Step 1c-check - macro 통합 검증
        run: python scripts/validate_macro.py

      # ── 2단계: 신호 대시보드 생성 ─────────────────────────────────────────
      - name: Step 2 - Generate signals dashboard
        run: python scripts/ecos_signals.py

      # ── 3단계: 레짐 분류 보고서 생성 ──────────────────────────────────────
      - name: Step 3 - Generate regime report
        run: python scripts/ecos_regime.py

      # ── 4단계: 결과물 커밋 & 푸시 ─────────────────────────────────────────
      - name: Step 4 - Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 변경사항이 있을 때만 커밋
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
            git commit -m "data: auto-update ${KST}"
            # 동시 push 충돌 방지: rebase 후 push
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
