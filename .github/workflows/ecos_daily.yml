name: ECOS Daily Fetch

on:
  schedule:
    # 매일 KST 06:10 (UTC 21:10 전날)
    - cron: '10 21 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: '수동 실행 이유 (선택)'
        required: false
        default: 'manual trigger'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 1단계: 원천 데이터 수집 ──────────────────────────────────────────
      - name: Step 1a - Fetch ECOS data (39개 지표)
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python ecos_fetch.py

      - name: Step 1b - Fetch KOSIS data (11개 지표)
        env:
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
        run: python kosis_fetch.py

      - name: Step 1b-check - KOSIS 수집 성공률 확인 (경고 전용, 파이프라인 중단 없음)
        run: |
          python - << 'PYEOF'
          import pandas as pd
          df = pd.read_csv("data/kosis_latest.csv")
          ok = int(df["value"].notna().sum())
          total = len(df)
          print(f"KOSIS 수집: {ok}/{total} 지표 성공")
          if ok < 8:
              print(f"::warning::KOSIS 수집 {ok}/{total} — 최소 8개 미달 (kosis.kr 연결 이슈 가능). "
                    "ECOS 데이터만으로 파이프라인 계속 진행.")
          else:
              print("[OK] KOSIS 수집 기준 통과")
          PYEOF

      - name: Step 1c - Merge ECOS + KOSIS → macro_latest.csv
        run: python scripts/merge_macro.py

      - name: Step 1c-check - macro 통합 검증
        run: python scripts/validate_macro.py

      # ── 2단계: 신호 대시보드 생성 ─────────────────────────────────────────
      - name: Step 2 - Generate signals dashboard
        run: python scripts/ecos_signals.py

      # ── 3단계: 레짐 분류 보고서 생성 ──────────────────────────────────────
      - name: Step 3 - Generate regime report
        run: python scripts/ecos_regime.py

      # ── 4단계: 결과물 커밋 & 푸시 ─────────────────────────────────────────
      - name: Step 4 - Commit and push results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 변경사항이 있을 때만 커밋
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')
          git commit -m "data: auto-update ${KST}"

          # data/ 는 매 실행마다 새로 생성되는 산출물이라 라인 단위 병합 대상이 아니다.
          # GitHub의 "Re-run" 은 최초 트리거 시점의 커밋을 그대로 체크아웃하므로,
          # 그 사이 같은 워크플로의 1차 시도(또는 다른 실행)가 이미 push 해 원격이
          # 앞서 있으면 예전 rebase 방식은 "자기 자신의 결과"와 충돌해 실패했다
          # (최근 30회 중 18회 실패 원인). push 가 거부될 때마다 원격을 fetch 해
          # 병합하되, data/ 충돌은 이번 실행이 방금 만든 최신 값으로 덮어써도
          # 안전하므로 -X ours 로 자동 해결한다.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5) — fetching and merging origin/${GITHUB_REF_NAME}."
            git fetch origin "$GITHUB_REF_NAME"
            if ! git merge -X ours --no-edit "origin/$GITHUB_REF_NAME"; then
              echo "::error::data/ 이외 경로에서 병합 충돌 발생 — 수동 확인 필요"
              git merge --abort || true
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::5회 재시도 후 push 실패"
          exit 1
