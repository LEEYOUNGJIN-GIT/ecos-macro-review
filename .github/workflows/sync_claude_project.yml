name: Sync ECOS+KOSIS to Claude Project

on:
  workflow_run:
    workflows: ["ECOS Daily Fetch"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Sync data files to Claude Project
        env:
          CLAUDE_SESSION_KEY: ${{ secrets.CLAUDE_SESSION_KEY }}
          CLAUDE_ORG_ID: ${{ secrets.CLAUDE_ORG_ID }}
          CLAUDE_PROJECT_ID: ${{ secrets.CLAUDE_PROJECT_ID }}
        run: |
          python3 << 'PYEOF'
          import os, sys, requests

          base = "https://claude.ai/api"
          org  = os.environ["CLAUDE_ORG_ID"]
          proj = os.environ["CLAUDE_PROJECT_ID"]
          key  = os.environ["CLAUDE_SESSION_KEY"]

          headers = {
              "cookie": f"sessionKey={key}",
              "content-type": "application/json",
              "user-agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "origin": "https://claude.ai",
              "referer": f"https://claude.ai/project/{proj}",
          }

          FILES = [
              ("ecos_latest.md",    "data/ecos_latest.md"),
              ("kosis_latest.md",   "data/kosis_latest.md"),
              ("ecos_regime.md",    "data/ecos_regime.md"),
              ("macro_latest.csv",  "data/macro_latest.csv"),
          ]
          # Claude 프로젝트로 전송하지 않는 파일. 이미 업로드된 사본은 삭제하고
          # 재업로드하지 않는다.
          REMOVE_ONLY = {"ecos_signals.md"}
          target_names = {f[0] for f in FILES} | REMOVE_ONLY

          # 기존 문서 목록 조회
          r = requests.get(
              f"{base}/organizations/{org}/projects/{proj}/docs",
              headers=headers
          )
          if not r.ok:
              print(f"[ERROR] 문서 목록 조회 실패: {r.status_code}")
              print(r.text[:300])
              sys.exit(1)

          existing = r.json()
          print(f"현재 프로젝트 문서 수: {len(existing)}")

          # [수정] 종전: 대상 문서를 먼저 전부 삭제한 뒤 업로드 -> 업로드가 중간에 실패하면 프로젝트에
          # 파일이 없는 채로 남는다. 변경: 새 사본 업로드가 성공한 파일만 기존 사본을 삭제한다.
          old_ids = {}
          for doc in existing:
              name = doc.get("file_name", "")
              uid = doc.get("uuid") or doc.get("id", "")
              if name in REMOVE_ONLY:
                  d = requests.delete(
                      f"{base}/organizations/{org}/projects/{proj}/docs/{uid}", headers=headers)
                  print(f"[DEL(remove-only)] {name}: HTTP {d.status_code}")
              elif name in target_names:
                  old_ids.setdefault(name, []).append(uid)

          failed = []
          for fname, fpath in FILES:
              if not os.path.isfile(fpath):
                  print(f"[SKIP] {fname}: {fpath} not found (기존 사본 유지)")
                  continue
              with open(fpath, encoding="utf-8") as f:
                  content = f.read()
              r = requests.post(
                  f"{base}/organizations/{org}/projects/{proj}/docs",
                  headers=headers,
                  json={"file_name": fname, "content": content}
              )
              if not r.ok:
                  print(f"[ERROR] {fname} 업로드 실패: {r.status_code} (기존 사본 유지)")
                  print(r.text[:300])
                  failed.append(fname)
                  continue
              print(f"[OK]  Uploaded {fname} ({len(content):,} chars)")
              for uid in old_ids.get(fname, []):
                  d = requests.delete(
                      f"{base}/organizations/{org}/projects/{proj}/docs/{uid}", headers=headers)
                  print(f"[DEL] old {fname}: HTTP {d.status_code}")

          if failed:
              print(f"::error::업로드 실패 {len(failed)}건: {failed}")
              sys.exit(1)

          print("ECOS + KOSIS + macro sync complete!")
          PYEOF
